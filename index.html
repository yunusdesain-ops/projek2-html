<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stok Akun Premium</title>
    <style>
        /* Desain Dasar & Warna */
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --success: #10B981;
            --bg: #F3F4F6;
            --card: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #E0E7FF 0%, #F3F4F6 100%);
            color: var(--text);
            margin: 0;
            padding: 20px 15px 60px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Kartu (Card) Modern */
        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            animation: slideUp 0.5s ease backwards;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }

        h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 18px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form & Input */
        input, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background: #FFF;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        /* Tombol (Button) */
        button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.97);
            background: var(--primary-hover);
        }

        .btn-danger { background: var(--danger); }
        .btn-danger:active { background: var(--danger-hover); }
        
        .btn-success { background: var(--success); }
        .btn-success:active { background: #059669; }
        
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline-success {
            background: transparent;
            color: var(--success);
            border: 1px solid var(--success);
        }

        .btn-small {
            padding: 8px;
            font-size: 12px;
            border-radius: 8px;
            width: auto;
        }

        .btn-jumlah {
            background: #E0E7FF;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            width: auto;
            border: 1px solid #C7D2FE;
        }

        .btn-jumlah:active {
            background: #C7D2FE;
        }

        /* Riwayat Item */
        .riwayat-item {
            background: #F9FAFB;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #F3F4F6;
            animation: fadeIn 0.4s ease;
            transition: all 0.3s ease;
        }

        /* Warna Riwayat Lunas */
        .riwayat-item.lunas {
            background: #ECFDF5;
            border-color: #A7F3D0;
        }

        .badge-status {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 8px;
            vertical-align: middle;
        }

        .status-belum {
            background: #FEE2E2;
            color: var(--danger);
        }

        .status-lunas {
            background: #D1FAE5;
            color: var(--success);
        }

        .riwayat-detail {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #D1D5DB;
            animation: slideDown 0.3s ease;
        }

        .riwayat-nomor {
            color: var(--text-light);
            font-size: 14px;
            font-family: monospace;
            background: #E5E7EB;
            padding: 12px;
            border-radius: 8px;
            margin: 0 0 10px 0;
            word-break: break-all;
            white-space: pre-wrap;
        }
        
        .riwayat-item.lunas .riwayat-nomor {
            background: #ffffff;
        }

        /* Output Sukses */
        #output-container {
            display: none;
            background: #ECFDF5;
            padding: 20px;
            border-radius: 16px;
            margin-top: 15px;
            border: 1px solid #A7F3D0;
            animation: slideDown 0.3s ease;
        }

        /* Toast Notifikasi */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: toastIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.fade-out { animation: toastOut 0.3s ease forwards; }

        /* Dashboard Stats */
        .stats-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }
        .stat-box {
            flex: 1;
        }
        .stat-divider {
            width: 1px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            margin: 0 15px;
        }

        /* Animasi Keyframes */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-20px) scale(0.9); } }
        
        .pulse-text { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        /* Indikator Online */
        .online-status { font-size: 12px; color: #A7F3D0; display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 15px;}
        .dot { width: 8px; height: 8px; background: #34D399; border-radius: 50%; box-shadow: 0 0 8px #34D399; animation: pulse 2s infinite; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="container">
    
    <!-- INFO STOK & TERJUAL -->
    <div class="card" style="background: linear-gradient(135deg, var(--primary) 0%, #6366F1 100%); color: white; padding: 24px 15px;">
        <div class="online-status">
            <div class="dot"></div> Live Sync Aktif
        </div>
        <div class="stats-container">
            <div class="stat-box">
                <p style="margin: 0; opacity: 0.9; font-size: 13px; font-weight: 600;">SISA STOK</p>
                <h2 style="margin: 5px 0 0; font-size: 38px;" class="pulse-text" id="info-stok">...</h2>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-box">
                <p style="margin: 0; opacity: 0.9; font-size: 13px; font-weight: 600;">TOTAL TERJUAL</p>
                <h2 style="margin: 5px 0 0; font-size: 38px;" id="info-terjual">...</h2>
            </div>
        </div>
    </div>

    <!-- TAMBAH STOK -->
    <div class="card">
        <h3>
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
            Tambah Stok Baru
        </h3>
        <textarea id="input-stok" placeholder="Paste nomor HP di sini...&#10;(Otomatis memisahkan nomor)"></textarea>
        <button onclick="window.tambahStok()">Simpan ke Stok</button>
    </div>

    <!-- JUAL AKUN -->
    <div class="card">
        <h3>
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            Jual & Ambil Akun
        </h3>
        <input type="text" id="input-pembeli" placeholder="Nama Pembeli (Opsional)">
        <input type="number" id="input-jumlah" placeholder="Jumlah Akun (misal: 10)">
        <button onclick="window.jualAkun()">Proses Penjualan</button>

        <!-- OUTPUT JUAL -->
        <div id="output-container">
            <h4 style="margin-top:0; margin-bottom: 10px; color: var(--success); display: flex; align-items: center; gap: 5px;">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
                Berhasil Diambil!
            </h4>
            <textarea id="output-nomor" readonly style="min-height: 120px; background: #fff; border-color: #A7F3D0;"></textarea>
            <button class="btn-outline" onclick="window.copyOutput()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Copy Semua Nomor
            </button>
        </div>
    </div>

    <!-- RIWAYAT -->
    <div class="card">
        <h3>
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Riwayat Terbaru
        </h3>
        <div id="list-riwayat">
            <p style="text-align:center; color:gray;">Memuat data sinkronisasi...</p>
        </div>
    </div>

    <!-- RESET STOK -->
    <div class="card" style="background: transparent; box-shadow: none; padding: 0;">
        <button class="btn-danger" onclick="window.resetStok()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            Reset Semua Data Stok
        </button>
    </div>
</div>

<!-- SCRIPT FIREBASE -->
<script type="module">
    // Import SDK Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    // Konfigurasi Firebase dari akunmu
    const firebaseConfig = {
        apiKey: "AIzaSyApMs7JNqHMETehPq63O-S3N9OfZwr3EfU",
        authDomain: "kopken-f598f.firebaseapp.com",
        databaseURL: "https://kopken-f598f-default-rtdb.firebaseio.com",
        projectId: "kopken-f598f",
        storageBucket: "kopken-f598f.firebasestorage.app",
        messagingSenderId: "550699829995",
        appId: "1:550699829995:web:9487eddfa98f3260f14cae",
        measurementId: "G-T0Y1TGP41M"
    };

    // Inisialisasi Aplikasi & Database
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const dbRef = ref(database, 'dataToko');

    let stok = [];
    let riwayat = [];

    // Fungsi Notifikasi Cantik (Toast)
    window.showToast = function(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerText = message;
        container.appendChild(toast);

        setTimeout(() => {
            toast.classList.add('fade-out');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // Fungsi Format Waktu (Jam:Menit)
    function getWaktuSekarang() {
        const now = new Date();
        const jam = String(now.getHours()).padStart(2, '0');
        const menit = String(now.getMinutes()).padStart(2, '0');
        return `${jam}:${menit}`;
    }

    // Ambil Data Dari Firebase Secara Real-time
    onValue(dbRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            stok = data.stok || [];
            riwayat = data.riwayat || [];
        } else {
            stok = [];
            riwayat = [];
        }
        updateUI();
    });

    // Simpan Data Ke Firebase
    function simpanKeFirebase() {
        set(dbRef, { stok: stok, riwayat: riwayat }).catch((error) => {
            window.showToast('Gagal terhubung ke database!', 'error');
            console.error(error);
        });
    }

    // Fungsi Update Tampilan
    function updateUI() {
        // Update Sisa Stok
        document.getElementById('info-stok').innerText = stok.length;
        
        // Update Total Terjual
        let totalTerjual = 0;
        riwayat.forEach(item => {
            totalTerjual += item.jumlah;
        });
        document.getElementById('info-terjual').innerText = totalTerjual;
        
        // Render Riwayat
        const list = document.getElementById('list-riwayat');
        list.innerHTML = '';
        
        if (riwayat.length === 0) {
            list.innerHTML = '<p style="color: var(--text-light); text-align:center; padding: 20px 0;">Belum ada penjualan</p>';
        } else {
            [...riwayat].reverse().forEach(item => {
                // Konfigurasi Status Lunas
                const isLunas = item.lunas === true; // Handle data lama yg belum ada properti lunas
                const statusBadge = isLunas 
                    ? '<span class="badge-status status-lunas">LUNAS</span>' 
                    : '<span class="badge-status status-belum">BELUM BAYAR</span>';
                const cardClass = isLunas ? 'riwayat-item lunas' : 'riwayat-item';
                const btnLunasText = isLunas ? 'Batalkan Lunas' : 'Tandai Lunas';
                const btnLunasClass = isLunas ? 'btn-outline-success btn-small' : 'btn-success btn-small';

                list.innerHTML += `
                    <div class="${cardClass}">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <p style="font-weight: 600; margin: 0; font-size: 15px; display: flex; align-items: center;">
                                    ${item.pembeli} ${statusBadge}
                                </p>
                                <p style="font-size: 12px; color: var(--text-light); margin: 4px 0 0;">Jam Pembelian: ${item.waktu || '-'}</p>
                            </div>
                            <button class="btn-jumlah" onclick="window.toggleDetail(${item.id})">
                                ${item.jumlah} Akun ▾
                            </button>
                        </div>
                        
                        <div id="detail-${item.id}" class="riwayat-detail">
                            <p style="font-size: 13px; font-weight: bold; margin: 0 0 8px 0; color: var(--text);">Detail Nomor:</p>
                            <p class="riwayat-nomor">${item.nomor.join('\n')}</p>
                            
                            <!-- Area Tombol Aksi 3 Kolom -->
                            <div style="display: flex; gap: 8px;">
                                <button class="${btnLunasClass}" style="flex: 1;" onclick="window.toggleLunas(${item.id})">${btnLunasText}</button>
                                <button class="btn-outline btn-small" style="flex: 1;" onclick="window.copyDetail(this, '${item.nomor.join('\\n')}')">Copy</button>
                                <button class="btn-danger btn-small" style="flex: 1;" onclick="window.batalJual(${item.id})">Batal</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    }

    // Fungsi Buka/Tutup Detail
    window.toggleDetail = function(id) {
        const detailBox = document.getElementById(`detail-${id}`);
        if (detailBox.style.display === 'block') {
            detailBox.style.display = 'none';
        } else {
            detailBox.style.display = 'block';
        }
    }

    // Fungsi Toggle Status Lunas
    window.toggleLunas = function(id) {
        const index = riwayat.findIndex(r => r.id === id);
        if (index !== -1) {
            // Ubah status (jika belum ada, set jadi true)
            riwayat[index].lunas = !riwayat[index].lunas;
            
            simpanKeFirebase(); // Sinkronisasi
            window.showToast(riwayat[index].lunas ? 'Pembayaran Ditandai Lunas!' : 'Status Lunas Dibatalkan', 'success');
        }
    }

    // Fungsi Copy Khusus di Riwayat
    window.copyDetail = function(btnElement, teks) {
        navigator.clipboard.writeText(teks).then(() => {
            const teksAsli = btnElement.innerText;
            btnElement.innerText = "Dicopy!";
            window.showToast('Nomor di riwayat berhasil dicopy!');
            setTimeout(() => {
                btnElement.innerText = teksAsli;
            }, 2000);
        }).catch(err => {
            window.showToast('Gagal mengcopy nomor', 'error');
        });
    }

    // Fungsi Tambah Stok
    window.tambahStok = function() {
        const input = document.getElementById('input-stok').value;
        if (!input.trim()) return window.showToast('Nomor masih kosong!', 'error');

        const nomorBaru = input.split(/[\n,]+/).map(n => n.replace(/\D/g, '')).filter(n => n.length > 5);
        
        if (nomorBaru.length === 0) return window.showToast('Tidak ada nomor yang valid', 'error');

        stok = stok.concat(nomorBaru);
        document.getElementById('input-stok').value = '';
        
        simpanKeFirebase(); // Sinkronisasi
        window.showToast(`Berhasil menambah ${nomorBaru.length} nomor ke stok`);
    }

    // Fungsi Jual Akun
    window.jualAkun = function() {
        const pembeli = document.getElementById('input-pembeli').value || 'Anonim';
        const jumlah = parseInt(document.getElementById('input-jumlah').value);

        if (!jumlah || jumlah <= 0) return window.showToast('Masukkan jumlah yang benar', 'error');
        if (jumlah > stok.length) return window.showToast(`Stok kurang! Sisa: ${stok.length}`, 'error');

        const nomorDiambil = stok.splice(0, jumlah);

        riwayat.push({
            id: Date.now(),
            pembeli: pembeli,
            jumlah: jumlah,
            waktu: getWaktuSekarang(),
            nomor: nomorDiambil,
            lunas: false // Default belum bayar saat dijual
        });

        const outputContainer = document.getElementById('output-container');
        const outputNomor = document.getElementById('output-nomor');
        
        outputNomor.value = nomorDiambil.join('\n');
        outputContainer.style.display = 'block';

        document.getElementById('input-pembeli').value = '';
        document.getElementById('input-jumlah').value = '';

        simpanKeFirebase(); // Sinkronisasi
        window.showToast('Penjualan diproses!');
    }

    // Fungsi Copy Output Baru Terjual
    window.copyOutput = function() {
        const teks = document.getElementById('output-nomor');
        teks.select();
        document.execCommand('copy');
        window.showToast('Nomor berhasil dicopy!');
    }

    // Fungsi Batal Jual
    window.batalJual = function(id) {
        if (!confirm('Yakin ingin membatalkan penjualan ini? Nomor akan kembali ke stok.')) return;

        const index = riwayat.findIndex(r => r.id === id);
        if (index !== -1) {
            const dataBatal = riwayat[index];
            stok = stok.concat(dataBatal.nomor);
            riwayat.splice(index, 1);
            
            simpanKeFirebase(); // Sinkronisasi
            window.showToast('Penjualan dibatalkan, stok kembali utuh.');
        }
    }

    // Fungsi Reset Stok
    window.resetStok = function() {
        if (confirm('Yakin ingin menghapus SEMUA stok dan riwayat? Data tidak bisa dikembalikan.')) {
            stok = [];
            riwayat = [];
            document.getElementById('output-container').style.display = 'none';
            
            simpanKeFirebase(); // Sinkronisasi
            window.showToast('Semua data berhasil direset');
        }
    }
</script>

</body>
</html>
